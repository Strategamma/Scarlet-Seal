services:
  - type: web
    name: scarlet-seal
    runtime: docker
    repo: https://github.com/Strategamma/Scarlet-Seal
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scarlet-seal-db
          property: connectionString
    domains:
      - scarletseal.decadenceinc.com
databases:
  - name: scarlet-seal-db
    plan: free
    region: singapore
